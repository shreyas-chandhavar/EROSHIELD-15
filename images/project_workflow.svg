<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<style>
text{font-family:Arial,sans-serif;fill:#1f2937}.t{font-size:28px;font-weight:700}.s{font-size:15px;fill:#4b5563}.h{font-size:18px;font-weight:700}.b{font-size:14px}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2}.accent{fill:#eef2ff;stroke:#475569;stroke-width:2}.arrow{stroke:#64748b;stroke-width:2.5;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="430" fill="white"/>
<text x="40" y="52" class="t">EROSHIELD-15 engineering workflow</text>
<text x="40" y="82" class="s">Public reference geometry → CAD protection concept → aerodynamic screening → configuration control → closeout</text>
<rect x="35" y="135" width="185" height="150" rx="12" class="box"/>
<text x="60" y="172" class="h">1. Public baseline</text><text x="60" y="205" class="b">IEA 15-MW blade</text><text x="60" y="232" class="b">AeroDyn geometry</text><text x="60" y="259" class="b">Station polars</text>
<rect x="265" y="135" width="185" height="150" rx="12" class="accent"/>
<text x="290" y="172" class="h">2. SolidWorks CAD</text><text x="290" y="205" class="b">Outer blade segment</text><text x="290" y="232" class="b">2 mm LE shield</text><text x="290" y="259" class="b">Assembly / fit checks</text>
<rect x="495" y="135" width="185" height="150" rx="12" class="box"/>
<text x="520" y="172" class="h">3. GNU Octave</text><text x="520" y="205" class="b">Differential BEM</text><text x="520" y="232" class="b">Erosion / LEP cases</text><text x="520" y="259" class="b">Window sensitivity</text>
<rect x="725" y="135" width="185" height="150" rx="12" class="accent"/>
<text x="750" y="172" class="h">4. Numerical audit</text><text x="750" y="205" class="b">252 / 252 converged</text><text x="750" y="232" class="b">Clipping tracked</text><text x="750" y="259" class="b">Model limits retained</text>
<rect x="955" y="135" width="210" height="150" rx="12" class="box"/>
<text x="980" y="172" class="h">5. TurboPLM release</text><text x="980" y="205" class="b">eBOM + requirements</text><text x="980" y="232" class="b">ECR / ECN</text><text x="980" y="259" class="b">Rev-A baseline</text>
<line x1="220" y1="210" x2="265" y2="210" class="arrow"/><line x1="450" y1="210" x2="495" y2="210" class="arrow"/><line x1="680" y1="210" x2="725" y2="210" class="arrow"/><line x1="910" y1="210" x2="955" y2="210" class="arrow"/>
<text x="40" y="352" class="s">Project status: closed at preliminary engineering / screening stage. No claim of production qualification or geometry-specific aerodynamic validation.</text>
</svg>